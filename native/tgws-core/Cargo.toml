[package]
name = "tgws-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Native core for TgwsOne: own TLS/TCP stack and DPI evasion primitives"
repository = "https://github.com/tgws-one/tgws-one"
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
libc = "0.2"
aes = "0.8"
ctr = "0.9"
# SHA-256 drives the TLS 1.3 key schedule and transcript hashes (RFC 8446 §7.1).
sha2 = "0.10"
# HKDF-Extract/Expand-Label for the TLS 1.3 key schedule (RFC 8446 §7.1).
hkdf = "0.12"
# AES-128-GCM record protection (TLS_AES_128_GCM_SHA256, RFC 8446 §5.2).
aes-gcm = "0.10"
# ChaCha20-Poly1305 record protection (TLS_CHACHA20_POLY1305_SHA256, RFC 8446 §5.2).
chacha20poly1305 = "0.10"
# X25519 key agreement for the key_share extension (RFC 8446 §4.2.8).
x25519-dalek = { version = "2", features = ["static_secrets"] }
# SHA-1 for the Sec-WebSocket-Accept handshake check (RFC 6455 §4.1).
sha1 = "0.10"
# Base64 for Sec-WebSocket-Key and Sec-WebSocket-Accept (RFC 6455 §4.1).
base64 = "0.22"
# X.509 path building, validity/name checks and CertificateVerify signature
# verification for the TLS 1.3 server certificate.  `rustls-webpki` is the
# maintained successor of the old `webpki` crate and keeps `webpki` as its
# library name; the `ring` backend is the audited signature implementation.
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
# DER certificate, `TrustAnchor`, `ServerName` and `UnixTime` types shared by
# webpki and the built-in root store.
rustls-pki-types = { version = "1", features = ["std"] }
# Mozilla's compiled-in root CA bundle.  Android does not expose the system
# trust store to Rust without extra JNI plumbing, so pinning the Mozilla set is
# the honest default for both Android and desktop.
webpki-roots = "1"
# JSON configuration and status/log payloads of the C ABI (RT10a).  The ABI
# exchanges JSON strings instead of packed C structs.
serde_json = "1"

[dev-dependencies]
libc = "0.2"
hex = "0.4"
