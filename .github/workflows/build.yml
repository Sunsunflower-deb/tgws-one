name: build

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install WiX
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Download upstream binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _upstream, _zapret_dl | Out-Null
          gh release download --repo Flowseal/tg-ws-proxy --pattern TgWsProxy_windows.exe --dir _upstream
          gh release download --repo Flowseal/zapret-discord-youtube --pattern "*.zip" --dir _zapret_dl
          $zip = Get-ChildItem _zapret_dl -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "zapret archive not found" }
          Expand-Archive $zip.FullName -DestinationPath _zapret -Force
          $bin = Get-ChildItem _zapret -Recurse -Filter winws.exe |
                 Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          if (-not $bin) { throw "winws.exe not found in zapret archive" }
          "ZAPRET_BIN=$($bin.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build MSI
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -match '^v\d') { $v = $v.Substring(1) } else { $v = "1.0.3.0" }
          if (($v -split '\.').Count -lt 4) { $v = "$v.0" }

          $signArgs = @()
          if ($env:SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            $signArgs = @("-Pfx", $pfx, "-PfxPassword", $env:SIGN_PFX_PASSWORD)
            Write-Host "подпись включена (SIGN_PFX_BASE64 задан)"
          } else {
            Write-Host "подпись не настроена: сборка без подписи"
          }

          ./build.ps1 -Engine _upstream\TgWsProxy_windows.exe -ZapretBin $env:ZAPRET_BIN -Version $v @signArgs

      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: dist/*.msi
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''

          # описание берём из CHANGELOG.md: раздел текущей версии
          $notes = "Сборка $tag."
          if (Test-Path CHANGELOG.md) {
            $text = Get-Content CHANGELOG.md -Raw -Encoding UTF8
            $m = [regex]::Match($text, "(?ms)^##\s*\[?$([regex]::Escape($ver))\]?[^\n]*\r?\n(.*?)(?=^##\s|\z)")
            if ($m.Success) {
              $body = $m.Groups[1].Value.Trim()
              if ($body) { $notes = $body }
            }
          }
          $footer = "---`nУстановщик приложен ниже: внутри приложение, движок прокси, zapret и списки — дополнительно ничего скачивать не нужно."
          $notes = "$notes`n`n$footer"
          [System.IO.File]::WriteAllText("release-notes.md", $notes, (New-Object System.Text.UTF8Encoding($false)))

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/*.msi --clobber
            gh release edit $tag --notes-file release-notes.md
          } else {
            gh release create $tag dist/*.msi `
              --title "TG WS Proxy $tag" `
              --notes-file release-notes.md
          }