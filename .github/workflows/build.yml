name: build

# A v* tag builds both platforms and publishes a release. A manual run (workflow_dispatch) and a pull request into main only
# build and keep the artifacts; a pull request never sees the signing secrets, so its MSI is unsigned.
# The version is the one in Directory.Build.props (it is what the program prints, what names the tarball and the PKGBUILD);
# a tag that does not say the same version fails the build before anything is published.
on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  linux:
    name: Linux (tarball, PKGBUILD)
    # The oldest runner image that is still supported: the self-contained .NET app links against the build machine's
    # glibc, so a tarball built on a newer system would not start on an older one.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The headless UI tests draw with Skia, which needs fontconfig.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1

      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match <Version> $version in Directory.Build.props" >&2
            exit 1
          fi

      - name: zapret2
        run: make zapret2

      - name: Build and test
        run: make build test

      - name: Test against the real engine
        run: make test-engine

      - name: Tarball and PKGBUILD
        run: make dist-linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            dist/tgwsone-*-linux-x64.tar.gz
            dist/tgwsone-*-linux-x64.tar.gz.sha256
            dist/PKGBUILD
            dist/tgwsone-bin.install

  windows:
    name: Windows (MSI)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "unexpected <Version> in Directory.Build.props: $version" }
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$version") {
            throw "tag $env:REF_NAME does not match <Version> $version in Directory.Build.props"
          }
          "MSI_VERSION=$version.0" | Out-File -FilePath $env:GITHUB_ENV -Append

      # wix.exe is a .NET apphost. A .NET 9+/10 apphost does not start on a Windows that does not fully support CET (an
      # unpatched Windows 10): "Your Windows doesn't fully support CET", exit code 0x80131506. The runner image is current, so
      # it starts here; build.ps1 runs wix as `dotnet wix.dll` by itself if it ever does not. `wix extension add` below has no
      # such fallback: on an image that hit this, call it as `dotnet <tool store>\wix.dll extension add ...` instead.
      # The tool install runs from the parent directory: global.json in the repo pins the SDK for everything under
      # the workspace, and under that pin `dotnet tool install` crashes on windows-latest (TransactionalAction
      # type-init). The install is --global anyway, so the working directory does not affect the result.
      - name: WiX
        shell: pwsh
        working-directory: ${{ github.workspace }}/../
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "wix install failed" }
          $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
          $tools | Out-File -FilePath $env:GITHUB_PATH -Append
          $env:PATH = "$tools;$env:PATH"
          wix extension add -g WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw "wix extension add (Util) failed" }
          wix extension add -g WixToolset.Firewall.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw "wix extension add (Firewall) failed" }

      - name: zapret2
        shell: pwsh
        run: ./zapret2/fetch.ps1

      # The same layout as `make build-win`: the zapret2 bundle and the target lists sit next to TgwsOne.exe.
      - name: Application
        shell: pwsh
        run: |
          dotnet publish src/TgwsOne -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out/publish/win-x64
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          Copy-Item out/zapret2/win-x64 out/publish/win-x64/zapret2 -Recurse
          New-Item -ItemType Directory -Force out/publish/win-x64/lists | Out-Null
          Copy-Item lists/*.txt out/publish/win-x64/lists/

      - name: MSI
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ github.event_name != 'pull_request' && secrets.SIGN_PFX_BASE64 || '' }}
          SIGN_PFX_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.SIGN_PFX_PASSWORD || '' }}
        run: |
          $signArgs = @()
          if ($env:SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            $signArgs = @("-Pfx", $pfx, "-PfxPassword", $env:SIGN_PFX_PASSWORD)
            Write-Host "подпись включена (SIGN_PFX_BASE64 задан)"
          } else {
            Write-Host "подпись не настроена: сборка без подписи"
          }
          ./build.ps1 -Version $env:MSI_VERSION @signArgs

      - uses: actions/upload-artifact@v4
        with:
          name: msi
          if-no-files-found: error
          path: dist/*.msi

  android:
    name: Android (APK)
    # ubuntu-22.04, the same base as the linux job: the Android workload supports it and an APK carries its own runtime,
    # so the runner's glibc does not matter. No newer image is needed for this workload.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The .NET Android workload builds with the JDK that JAVA_HOME points at; 17 is the version it supports.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android workload
        run: dotnet workload install android

      # One publish per ABI, so each APK stays small. RuntimeIdentifiers is pinned to that ABI; TargetFrameworks is pinned
      # to net10.0-android because the shared, engine and mobile projects also build for net10.0, where the android-arm RID
      # resolves to a linux-bionic-arm runtime pack that .NET 10 no longer ships. AndroidKeyStore=false is what makes the
      # release build use the SDK debug key: the CI artifact needs no owner key.
      - name: APKs
        run: |
          set -euo pipefail
          version=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props)
          rm -rf out/publish/android dist/android
          for rid in android-arm64 android-arm android-x64; do
            case "$rid" in
              android-arm64) abi=arm64-v8a ;;
              android-arm) abi=armeabi-v7a ;;
              android-x64) abi=x86_64 ;;
            esac
            # TGWS_ENABLE_ANDROID=true turns on the opt-in android target in the referenced Shared/engine/mobile projects.
            dotnet publish src/TgwsOne.Android -c Release -f net10.0-android \
              -r "$rid" -p:TargetFrameworks=net10.0-android -p:RuntimeIdentifiers="$rid" \
              -p:TGWS_ENABLE_ANDROID=true \
              -p:AndroidKeyStore=false -o "out/publish/android/$rid"
            mkdir -p dist/android
            cp "out/publish/android/$rid/io.github.sunsunflowerdeb.tgwsone-Signed.apk" \
              "dist/android/tgwsone-$version-android-$abi.apk"
          done
          (cd dist/android && sha256sum *.apk > SHA256SUMS)
          cat dist/android/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: |
            dist/android/*.apk
            dist/android/SHA256SUMS

  release:
    name: Release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Every artifact lands in a folder of its own name: release/linux/…, release/msi/….
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          $ver = $tag -replace '^v', ''

          # описание берём из CHANGELOG.md: раздел текущей версии
          $notes = "Сборка $tag."
          if (Test-Path CHANGELOG.md) {
            $text = Get-Content CHANGELOG.md -Raw -Encoding UTF8
            $m = [regex]::Match($text, "(?ms)^##\s*\[?$([regex]::Escape($ver))\]?[^\n]*\r?\n(.*?)(?=^##\s|\z)")
            if ($m.Success) {
              $body = $m.Groups[1].Value.Trim()
              if ($body) { $notes = $body }
            }
          }
          $footer = "---`nWindows: установщик TgwsOne-$ver.msi — внутри приложение (движок прокси встроен), zapret2 и списки, ничего дополнительно скачивать не нужно.`nLinux: архив tgwsone-$ver-linux-x64.tar.gz (внутри install.sh) или пакет для Arch Linux — PKGBUILD tgwsone-bin."
          $notes = "$notes`n`n$footer"
          [System.IO.File]::WriteAllText("release-notes.md", $notes, (New-Object System.Text.UTF8Encoding($false)))

          $files = @(Get-ChildItem release -Recurse -File | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw "нет файлов для релиза: артефакты не скачались" }
          $files | ForEach-Object { Write-Host "в релиз: $_" }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
            gh release edit $tag --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed" }
          } else {
            gh release create $tag @files --title "TgwsOne $tag" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }
